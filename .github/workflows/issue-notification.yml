# Issue Notification Workflow for onboarding requests
name: Issue Notification

on:
  issues:
    types: [opened]

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'infrastructure/onboarding')
    steps:
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/infra/ci/camunda-community-hub/infrastructure SLACK_ASKINFRA_WEBHOOK_URL
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        env:
          COMMUNITY_HUB_VAULT_SECRETS_TF_FILE: https://github.com/camunda/infra-core/blob/stage/terraform/github/prod/camunda-community-hub-vault-secrets.tf
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*New Community Hub Repository Onboarding Request* submission from @${{ github.event.issue.user.login }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Issue Title*\n${{ github.event.issue.title }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.issue.html_url }}|View Issue #${{ github.event.issue.number }}>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Action Required*\n<${{ env.COMMUNITY_HUB_VAULT_SECRETS_TF_FILE }}|➜ Configure repository in infra-core>"
                  }
                }
              ]
            }
          webhook: ${{ steps.secrets.outputs.SLACK_ASKINFRA_WEBHOOK_URL }}
          webhook-type: incoming-webhook
